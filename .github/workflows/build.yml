name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare project
        run: |
          echo "Распаковываем архив..."
          unzip -q youtube-cx.zip -d temp_src
          
          echo "Ищем корень проекта (где лежит gradlew)..."
          GRADLEW_PATH=$(find temp_src -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Ошибка: файл gradlew не найден в архиве!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Корень проекта найден: $PROJECT_ROOT"
          
          echo "Перемещаем файлы в корень репозитория..."
          mv "$PROJECT_ROOT"/* .
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
          
          echo "Удаляем временные файлы..."
          rm -rf temp_src youtube-cx.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
