name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare project
        run: |
          echo "Распаковываем архив..."
          unzip -q youtube-cx.zip -d temp_src
          
          echo "Ищем корень проекта..."
          ROOT_FILE=$(find temp_src -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$ROOT_FILE" ]; then
            echo "Ошибка: файл настроек проекта не найден!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$ROOT_FILE")
          echo "Перемещаем файлы в корень репозитория..."
          mv "$PROJECT_ROOT"/* .
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
          rm -rf temp_src youtube-cx.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Dummy Google Services JSON (if missing)
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Создаем затычку для google-services.json..."
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"gmscx-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.gmscx.services"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly"}]}]}' > app/google-services.json
          fi

      - name: Generate Debug Keystore
        run: |
          echo "Генерируем debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK with standard Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
